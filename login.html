<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="assets/css/login.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <main class="container">
        <div class="card" id="info-login">
            <img src="assets/images/logo.webp" alt="Logo Smart Control">
            <h1>Smart Control</h1>
            <h2>Login</h2>
        </div>
        <div class="card">
            <form method="post" id="form-login">
                <label for="email">E-mail:</label>
                <input type="email" name="email" id="email" placeholder="Digite seu e-mail..." required>

                <label for="senha">Senha:</label>
                <input type="password" name="senha" id="senha" minlength="8" placeholder="********" required>

                <div class="btns">
                    <input type="button" value="Cadastrar" onclick="window.location.href='cadastro.html'">
                    <input type="submit" value="Entrar">
                </div>
            </form>
        </div>
    </main>
</body>
</html>
